name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download SHA256SUMS
        run: |
          VERSION="${{ github.event.inputs.version }}"
          curl -fsSL -o SHA256SUMS \
            "https://github.com/Bugb-Technologies/cert-x-gen/releases/download/v${VERSION}/SHA256SUMS"
          cat SHA256SUMS

      # Every checksum must be present. Without this guard a renamed or missing
      # release asset yields an empty `sha256 ""` in the formula, which Homebrew
      # only rejects at install time -- on the user's machine, not here.
      - name: Extract checksums
        id: checksums
        run: |
          set -euo pipefail
          for pair in \
            "DARWIN_AMD64:cxg-darwin-amd64" \
            "DARWIN_ARM64:cxg-darwin-arm64" \
            "LINUX_AMD64:cxg-linux-amd64" \
            "LINUX_ARM64:cxg-linux-arm64"
          do
            key="${pair%%:*}"
            asset="${pair##*:}"
            # Exact filename match on field 2 (sha256sum writes "<hash>  <name>",
            # or "<hash> *<name>" in binary mode). awk exits 0 on no match, so the
            # explicit emptiness check below reports it instead of `set -e`
            # killing the step with no message.
            sum=$(awk -v a="$asset" '$2 == a || $2 == "*" a { print $1 }' SHA256SUMS)
            if [ -z "$sum" ]; then
              echo "::error::No checksum for ${asset} in SHA256SUMS for v${{ github.event.inputs.version }}"
              exit 1
            fi
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Update formula
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"

          cat > Formula/cxg.rb << 'EOF'
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for CERT-X-GEN (cxg)
          # A polyglot execution engine for vulnerability detection
          #
          # Generated by .github/workflows/update-formula.yml on each cert-x-gen
          # release. Edit the workflow, not this file -- a hand edit here is
          # overwritten by the next release.
          class Cxg < Formula
            desc "Polyglot execution engine for vulnerability detection"
            homepage "https://github.com/Bugb-Technologies/cert-x-gen"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              on_intel do
                url "https://github.com/Bugb-Technologies/cert-x-gen/releases/download/vVERSION_PLACEHOLDER/cxg-darwin-amd64"
                sha256 "DARWIN_AMD64_PLACEHOLDER"
              end
              on_arm do
                url "https://github.com/Bugb-Technologies/cert-x-gen/releases/download/vVERSION_PLACEHOLDER/cxg-darwin-arm64"
                sha256 "DARWIN_ARM64_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/Bugb-Technologies/cert-x-gen/releases/download/vVERSION_PLACEHOLDER/cxg-linux-amd64"
                sha256 "LINUX_AMD64_PLACEHOLDER"
              end
              on_arm do
                url "https://github.com/Bugb-Technologies/cert-x-gen/releases/download/vVERSION_PLACEHOLDER/cxg-linux-arm64"
                sha256 "LINUX_ARM64_PLACEHOLDER"
              end
            end

            def install
              bin.install Dir["cxg-*"].first => "cxg"
            end

            # Templates are fetched at first use, not at install time. Running
            # `cxg template update` from post_install writes outside the formula
            # prefix, which Homebrew's install sandbox denies -- it failed the
            # install rather than the download. Tell the user instead.
            def caveats
              <<~EOS
                To download vulnerability detection templates, run:
                  cxg template update

                Templates will be installed to ~/.cert-x-gen/templates/
              EOS
            end

            test do
              assert_match "cxg", shell_output("#{bin}/cxg --version")
            end
          end
          EOF

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/cxg.rb
          sed -i "s/DARWIN_AMD64_PLACEHOLDER/${{ steps.checksums.outputs.DARWIN_AMD64 }}/g" Formula/cxg.rb
          sed -i "s/DARWIN_ARM64_PLACEHOLDER/${{ steps.checksums.outputs.DARWIN_ARM64 }}/g" Formula/cxg.rb
          sed -i "s/LINUX_AMD64_PLACEHOLDER/${{ steps.checksums.outputs.LINUX_AMD64 }}/g" Formula/cxg.rb
          sed -i "s/LINUX_ARM64_PLACEHOLDER/${{ steps.checksums.outputs.LINUX_ARM64 }}/g" Formula/cxg.rb

          cat Formula/cxg.rb

      # Catches a malformed heredoc or a placeholder that survived substitution
      # before it reaches main, rather than at `brew install` on a user's machine.
      - name: Validate generated formula
        run: |
          set -euo pipefail
          ruby -c Formula/cxg.rb
          if grep -q "PLACEHOLDER" Formula/cxg.rb; then
            echo "::error::Formula still contains an unsubstituted PLACEHOLDER"
            exit 1
          fi
          if grep -qE 'sha256 ""' Formula/cxg.rb; then
            echo "::error::Formula contains an empty sha256"
            exit 1
          fi

      # Pushes straight to main. The branch ruleset requires a pull request for
      # everyone except the GitHub Actions app, which is listed in bypass_actors
      # precisely so this release step needs no human in the loop.
      - name: Commit and push
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/cxg.rb
          if git diff --cached --quiet; then
            echo "Formula already at v${VERSION}; nothing to commit."
            exit 0
          fi
          git commit -m "Update cxg to v${VERSION}"
          git push
